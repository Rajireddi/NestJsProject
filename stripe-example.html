<!DOCTYPE html>
<html>
<head>
    <title>Stripe Payment Example</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #6772e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #5560d0;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        #card-element {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Stripe Payment Integration Example</h1>
    
    <form id="payment-form">
        <div class="form-group">
            <label for="amount">Amount:</label>
            <input type="number" id="amount" step="0.01" min="0.01" required>
        </div>
        
        <div class="form-group">
            <label for="currency">Currency:</label>
            <select id="currency" required>
                <option value="usd">USD</option>
                <option value="eur">EUR</option>
                <option value="gbp">GBP</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="description">Description:</label>
            <input type="text" id="description">
        </div>
        
        <div class="form-group">
            <label for="card-element">Credit or debit card</label>
            <div id="card-element"><!-- Stripe Element will be inserted here --></div>
            <div id="card-errors" role="alert"></div>
        </div>
        
        <button id="submit-button">Create and Process Payment</button>
    </form>
    
    <div id="result"></div>

    <script>
        // Initialize Stripe with your publishable key
        // TODO: Replace with your actual Stripe publishable key
        const stripe = Stripe('pk_test_51SMVAeGXMEADwhEhVpq030SQw6fVpMf6xP8XKjrYOBaCPoKoMg2wLaczIIRswrGOwJs11cRofD29onHG19yWiSno00GQfPJZoi');
        
        // Create an instance of Elements
        const elements = stripe.elements();
        
        // Create an instance of the card Element
        const card = elements.create('card');
        
        // Add an instance of the card Element into the `card-element` <div>
        card.mount('#card-element');
        
        // Handle real-time validation errors from the card Element
        card.on('change', function(event) {
            const displayError = document.getElementById('card-errors');
            if (event.error) {
                displayError.textContent = event.error.message;
            } else {
                displayError.textContent = '';
            }
        });
        
        // Handle form submission
        const form = document.getElementById('payment-form');
        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const submitButton = document.getElementById('submit-button');
            submitButton.disabled = true;
            submitButton.textContent = 'Processing...';
            
            // Get form values
            const amount = document.getElementById('amount').value;
            const currency = document.getElementById('currency').value;
            const description = document.getElementById('description').value;
            
            try {
                // Step 1: Create a payment in your backend
                const createResponse = await fetch('http://localhost:3005/payments', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        amount: parseFloat(amount),
                        currency,
                        description
                    })
                });
                
                if (!createResponse.ok) {
                    throw new Error('Failed to create payment');
                }
                
                const payment = await createResponse.json();
                
                // Step 2: Create a payment method with Stripe
                const {paymentMethod, error} = await stripe.createPaymentMethod({
                    type: 'card',
                    card: card,
                });
                
                if (error) {
                    throw new Error(error.message);
                }
                
                // Step 3: Process the payment with your backend
                const processResponse = await fetch(`http://localhost:3005/payments/${payment.id}/process`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        paymentMethodId: paymentMethod.id
                    })
                });
                
                if (!processResponse.ok) {
                    throw new Error('Failed to process payment');
                }
                
                const processedPayment = await processResponse.json();
                
                // Display success message
                document.getElementById('result').innerHTML = `
                    <div class="result success">
                        <h3>Payment Successful!</h3>
                        <p>Payment ID: ${processedPayment.id}</p>
                        <p>Status: ${processedPayment.status}</p>
                        <p>Amount: ${processedPayment.amount} ${processedPayment.currency.toUpperCase()}</p>
                    </div>
                `;
            } catch (error) {
                // Display error message
                document.getElementById('result').innerHTML = `
                    <div class="result error">
                        <h3>Payment Failed</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Create and Process Payment';
            }
        });
    </script>
</body>
</html>
